[package]
name = "petope"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
bytes = "1"
iroh = "1.0.0-rc.0"
tun-rs = { version = "2.8", features = ["async", "async_framed"] }
etherparse = "0.20"
net-route = "0.4.6"
serde = "1"
toml_edit = "0.25"
base64 = "0.22"
zeroize = "1"
getifs = "0.5"
futures-lite = "2.6"
futures = "0.3"                                                    # unfortunately for SinkExt api
ring-channel = "0.12"
dashmap = "6"
arc-swap = "1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
