[workspace]
resolver = "3"
members = ["src/petope-tun"]

[package]
name = "petope"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
bytes = "1"
iroh = "1.0.0-rc.0"
etherparse = "0.20"
serde = "1"
toml_edit = { version = "0.25", features = ["serde"] }
base64 = "0.22"
futures = "0.3"                                                     # unfortunately for SinkExt api
dashmap = "6"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ipnetwork = { version = "0.20", features = ["serde"] }
prefix-trie = { version = "0.8", features = ["ipnetwork"] }
thiserror = "2.0.18"
